<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="XDB app icon" shape-rendering="crispEdges">
  <!-- Pixel database cylinder: three stacked disks on a 16x16 grid. -->
  <style>
    .px { fill: #000000; }
    @media (prefers-color-scheme: dark) { .px { fill: #ffffff; } }
  </style>
  <g class="px">
    <rect x="5" y="1" width="6" height="1"/>
    <rect x="3" y="2" width="10" height="1"/>
    <rect x="2" y="3" width="12" height="2"/>
    <rect x="2" y="6" width="12" height="3"/>
    <rect x="2" y="10" width="12" height="3"/>
    <rect x="3" y="13" width="10" height="1"/>
    <rect x="5" y="14" width="6" height="1"/>
  </g>
</svg>
