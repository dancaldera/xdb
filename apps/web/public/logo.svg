<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="XDB app icon" shape-rendering="crispEdges">
  <!-- Pixel "XD" monogram on a 16x16 grid. -->
  <style>
    .px { fill: #000000; }
    @media (prefers-color-scheme: dark) { .px { fill: #ffffff; } }
  </style>
  <g class="px">
    <!-- X -->
    <rect x="1" y="3" width="2" height="1"/><rect x="7" y="3" width="2" height="1"/>
    <rect x="1" y="4" width="2" height="1"/><rect x="7" y="4" width="2" height="1"/>
    <rect x="2" y="5" width="2" height="1"/><rect x="6" y="5" width="2" height="1"/>
    <rect x="3" y="6" width="4" height="1"/>
    <rect x="4" y="7" width="2" height="1"/>
    <rect x="3" y="8" width="4" height="1"/>
    <rect x="2" y="9" width="2" height="1"/><rect x="6" y="9" width="2" height="1"/>
    <rect x="1" y="10" width="2" height="1"/><rect x="7" y="10" width="2" height="1"/>
    <rect x="1" y="11" width="2" height="1"/><rect x="7" y="11" width="2" height="1"/>
    <!-- D -->
    <rect x="10" y="3" width="1" height="9"/>
    <rect x="14" y="4" width="1" height="7"/>
    <rect x="11" y="3" width="3" height="1"/>
    <rect x="11" y="11" width="3" height="1"/>
  </g>
</svg>
